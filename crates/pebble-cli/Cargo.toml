[package]
name = "pebble-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Command-line coding agent built on pebble-coding-agent; the front end lives in pebble-cli-core"

[[bin]]
name = "pebble"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
pebble-cli-core = { path = "../pebble-cli-core" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["pty", "termios"] }
vte = "=0.14.1"

[dev-dependencies]
# The CLI cases answer the model from a deterministic OpenAI-compatible server
# running in the test process, so the real codec and transport are exercised
# with no key and no network. The Rust API scenarios beside them drive the
# libraries the binary is built from.
anyhow = "1.0.104"
async-trait.workspace = true
axum = "0.8"
base64 = "=0.22.1"
futures-util.workspace = true
lithos-llm = { workspace = true, features = [
  "runtime",
  "builtin-catalog",
  "environment-credentials",
] }
pebble-agent = { path = "../pebble-agent" }
pebble-coding-agent = { path = "../pebble-coding-agent", features = ["test-util"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
unicode-width = "=0.2.2"
uuid = { version = "=1.18.1", features = ["v4"] }
trycmd = "1.2.1"
twin-openai = { git = "https://github.com/lithoscomputer/twins", branch = "main" }

[lints]
workspace = true
